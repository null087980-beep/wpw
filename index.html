
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bunga Ungu Untukmu 💜</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(
        circle at center,
        #32104f,
        #160524,
        #08010e
    );
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
    color: white;
}

.container {
    text-align: center;
    position: relative;
    z-index: 2;
}

h1 {
    color: #e5b8ff;
    font-size: 30px;
    text-shadow: 0 0 15px #c77dff;
    margin-bottom: 15px;
}

.flower {
    position: relative;
    width: 220px;
    height: 260px;
    margin: auto;
}

.stem {
    position: absolute;
    width: 7px;
    height: 150px;
    background: linear-gradient(#6bd66b, #176b38);
    left: 107px;
    top: 105px;
    border-radius: 10px;
    transform-origin: top;
    animation: grow 2s ease forwards;
}

.leaf {
    position: absolute;
    width: 65px;
    height: 30px;
    background: linear-gradient(45deg, #176b38, #75db76);
    border-radius: 100% 0 100% 0;
    top: 175px;
    left: 50px;
    transform: rotate(15deg);
}

.leaf.right {
    left: 108px;
    top: 205px;
    transform: rotate(70deg);
}

.petals {
    position: absolute;
    top: 10px;
    left: 45px;
    width: 130px;
    height: 130px;
    animation: bloom 3s ease-in-out infinite alternate;
}

.petal {
    position: absolute;
    width: 55px;
    height: 85px;
    background: linear-gradient(
        135deg,
        #f1c5ff,
        #c45aff,
        #8428c7
    );
    border-radius: 50% 50% 45% 45%;
    left: 37px;
    top: 0;
    transform-origin: 50% 65px;
    box-shadow: 0 0 20px #c77dff;
}

.petal:nth-child(1) { transform: rotate(0deg); }
.petal:nth-child(2) { transform: rotate(60deg); }
.petal:nth-child(3) { transform: rotate(120deg); }
.petal:nth-child(4) { transform: rotate(180deg); }
.petal:nth-child(5) { transform: rotate(240deg); }
.petal:nth-child(6) { transform: rotate(300deg); }

.center {
    position: absolute;
    width: 35px;
    height: 35px;
    background: radial-gradient(circle, #fff5a3, #ffb700);
    border-radius: 50%;
    top: 48px;
    left: 47px;
    box-shadow: 0 0 20px #ffe66d;
}

.message {
    margin-top: 15px;
    font-size: 18px;
    color: #f3d8ff;
    line-height: 1.7;
    text-shadow: 0 0 10px #c77dff;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    border: 1px solid #e3b4ff;
    border-radius: 30px;
    background: #8b35bd;
    color: white;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 15px #c77dff;
}

button:hover {
    background: #b65de8;
}

.star {
    position: absolute;
    color: #fff1a8;
    animation: twinkle 2s infinite alternate;
}

@keyframes bloom {
    from { transform: scale(.75); }
    to { transform: scale(1.1); }
}

@keyframes grow {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
}

@keyframes twinkle {
    from { opacity: .2; transform: scale(.6); }
    to { opacity: 1; transform: scale(1.3); }
}
</style>
</head>

<body>

<div class="container">

    <h1>For Someone Special 💜</h1>

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf"></div>
        <div class="leaf right"></div>

        <div class="petals">
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
        </div>

    </div>

    <div class="message" id="message">
        Seperti bunga ungu yang indah,<br>
        semoga harimu selalu penuh warna. 💜
    </div>

    <button onclick="showMessage()">
        Klik Pesan Rahasia ✨
    </button>

</div>

<script>
const messages = [
    "Bunga ini mungkin sederhana,<br>tapi dipersembahkan dengan tulus. 💜",
    "Semoga kebahagiaan selalu mekar<br>di setiap langkahmu. 🌷",
    "Jadilah seperti bunga,<br>tetap indah di setiap musim. ✨",
    "Satu bunga kecil,<br>untuk seseorang yang istimewa. 💜"
];

let index = 0;

function showMessage() {
    document.getElementById("message").innerHTML =
        messages[index];

    index = (index + 1) % messages.length;
}

// Membuat bintang
for (let i = 0; i < 45; i++) {
    let star = document.createElement("div");

    star.className = "star";
    star.innerHTML = "✦";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.fontSize = (8 + Math.random() * 15) + "px";
    star.style.animationDelay = Math.random() * 3 + "s";

    document.body.appendChild(star);
}
</script>

</body>
</html>
