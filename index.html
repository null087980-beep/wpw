
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animasi Hati</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #13001f, #4b003b, #16001c);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.container {
  text-align: center;
  color: white;
}

.heart {
  font-size: 120px;
  animation: beat 1s infinite;
  filter: drop-shadow(0 0 25px #ff0055);
}

h1 {
  margin-top: 25px;
  color: #ff8ab5;
  text-shadow: 0 0 15px #ff0055;
}

p {
  margin-top: 12px;
  font-size: 17px;
  color: white;
}

button {
  margin-top: 25px;
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: #ff2678;
  color: white;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 0 15px #ff2678;
}

button:hover {
  background: #ff0055;
  transform: scale(1.1);
}

@keyframes beat {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.3);
  }
}

.love {
  position: absolute;
  bottom: -30px;
  color: #ff4f91;
  animation: naik 5s linear infinite;
  pointer-events: none;
}

@keyframes naik {
  0% {
    transform: translateY(0) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="heart">❤️</div>
  <h1>I Love You</h1>
  <p>hai ani syah Kamu adalah sesuatu yang istimewa ❤️</p>
  <button onclick="pesan()">Klik Aku ❤️</button>
</div>

<script>
function pesan() {
  alert("❤️ Terima kasih sudah hadir di hidupku ❤️");
}

// Membuat hati terbang
function buatHati() {
  const hati = document.createElement("div");

  hati.className = "love";
  hati.innerHTML = "❤️";

  hati.style.left = Math.random() * 100 + "vw";
  hati.style.fontSize = (15 + Math.random() * 30) + "px";
  hati.style.animationDuration = (3 + Math.random() * 4) + "s";

  document.body.appendChild(hati);

  setTimeout(() => {
    hati.remove();
  }, 7000);
}

setInterval(buatHati, 300);
</script>

</body>
</html>
